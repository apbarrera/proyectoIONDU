<app-page-header
  title="Registrar gasto"
  subtitle="Registra un gasto manual de tu negocio."
  [breadcrumb]="[{ label: 'Gastos', link: '/expenses/history' }, { label: 'Registrar gasto' }]"
/>

<app-card title="Datos del gasto">
  <form [formGroup]="form" class="new-expense__form">
    <app-form-field label="Fecha" required>
      <input type="date" formControlName="date" />
    </app-form-field>
    <app-form-field label="Categoría" required>
      <select formControlName="category">
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.name">{{ cat.name }}</option>
        }
      </select>
    </app-form-field>
    <app-form-field label="RUC o cédula del proveedor" hint="Opcional. Si ya existe, se autocompleta el nombre.">
      <input formControlName="providerRuc" inputmode="numeric" (input)="onSupplierIdChange()" />
    </app-form-field>
    <app-form-field label="Proveedor">
      <input formControlName="providerName" placeholder="Nombre del proveedor" />
    </app-form-field>
    <app-form-field label="Total (con IVA)" required>
      <input type="number" step="0.01" min="0" formControlName="total" />
    </app-form-field>
    <app-form-field label="Método de pago" required>
      <select formControlName="paymentMethod">
        <option value="efectivo">Efectivo</option>
        <option value="tarjeta_debito">Tarjeta de débito</option>
        <option value="tarjeta_credito">Tarjeta de crédito</option>
        <option value="transferencia">Transferencia</option>
        <option value="cheque">Cheque</option>
      </select>
    </app-form-field>
    <app-form-field label="Descripción" required>
      <input formControlName="description" />
    </app-form-field>
    <app-form-field label="N.º de comprobante">
      <input formControlName="receiptNumber" placeholder="001-001-000000123" />
    </app-form-field>
  </form>

  @if (form.touched && form.errors?.['providerRuc']) {
    <p class="new-expense__error" role="alert">Ingresa una cédula (10 dígitos) o un RUC (13 dígitos) válido.</p>
  } @else if (form.touched && form.errors?.['providerName']) {
    <p class="new-expense__error" role="alert">Escribe el nombre del proveedor para registrarlo.</p>
  }

  <app-button [loading]="submitting()" (clicked)="save()">Guardar gasto</app-button>
</app-card>
