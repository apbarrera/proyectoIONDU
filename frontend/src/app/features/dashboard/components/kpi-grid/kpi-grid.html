<div class="kpi-grid">
  <app-stat-card label="Ingresos" [value]="(summary().income | currency: 'USD' : 'symbol' : '1.2-2' : 'en-US') ?? ''" icon="income" />
  <app-stat-card label="Gastos" [value]="(summary().expenses | currency: 'USD' : 'symbol' : '1.2-2' : 'en-US') ?? ''" icon="expense" />
  <app-stat-card
    label="Utilidad"
    [value]="(summary().profit | currency: 'USD' : 'symbol' : '1.2-2' : 'en-US') ?? ''"
    icon="profit"
    [trend]="summary().profit >= 0 ? 'up' : 'down'"
    [trendLabel]="summary().profit >= 0 ? 'Positiva' : 'Negativa'"
  />
  <app-stat-card label="Ventas" [value]="summary().salesCount.toString()" icon="cart" />
  <app-stat-card label="Ticket promedio" [value]="(summary().averageTicket | currency: 'USD' : 'symbol' : '1.2-2' : 'en-US') ?? ''" icon="ticket" />
</div>
