<app-page-header
  title="Preferencias"
  subtitle="Personaliza cómo se ve IONDU y la seguridad de tu cuenta."
  [breadcrumb]="[{ label: 'Configuración', link: '/settings/company' }, { label: 'Preferencias' }]"
/>

<app-card title="Apariencia">
  <p class="preferences__description">Elige el modo de color de la interfaz.</p>
  <div class="preferences__options">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="preferences__option"
        [class.preferences__option--active]="themeService.preference() === option.value"
        (click)="themeService.setPreference(option.value)"
      >
        <app-icon class="preferences__icon" [name]="option.icon" [size]="20" />
        <span>{{ option.label }}</span>
      </button>
    }
  </div>
</app-card>

<app-card title="Seguridad">
  <p class="preferences__description">
    Cambia tu contraseña. Al guardarla se cerrará tu sesión en los demás dispositivos.
  </p>
  <form class="preferences__password" [formGroup]="passwordForm" (ngSubmit)="changePassword()">
    <app-form-field label="Contraseña actual" required [error]="fieldError('currentPassword')">
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
    </app-form-field>
    <app-form-field
      label="Contraseña nueva"
      required
      [hint]="'Mínimo ' + minLength + ' caracteres.'"
      [error]="fieldError('newPassword')"
    >
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
    </app-form-field>
    <app-form-field label="Repite la contraseña nueva" required [error]="fieldError('confirmPassword')">
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </app-form-field>
    <div class="preferences__actions">
      <app-button type="submit" [loading]="changingPassword()">Cambiar contraseña</app-button>
    </div>
  </form>
</app-card>
