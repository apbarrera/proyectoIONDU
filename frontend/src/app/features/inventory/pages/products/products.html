<app-page-header
  title="Productos"
  subtitle="Administra los productos para venta y los insumos de tu inventario."
  [breadcrumb]="[{ label: 'Inventario', link: '/inventory/products' }, { label: 'Productos' }]"
>
  <app-button (clicked)="openCreate()">+ Nuevo producto</app-button>
</app-page-header>

<div class="products__filters">
  <button type="button" class="products__filter"
    [class.products__filter--active]="typeFilter() === 'todos'"
    (click)="typeFilter.set('todos')">Todos</button>
  <button type="button" class="products__filter"
    [class.products__filter--active]="typeFilter() === 'venta'"
    (click)="typeFilter.set('venta')">Para venta</button>
  <button type="button" class="products__filter"
    [class.products__filter--active]="typeFilter() === 'insumo'"
    (click)="typeFilter.set('insumo')">Insumos</button>
  <button type="button" class="products__filter"
    [class.products__filter--active]="typeFilter() === 'ambos'"
    (click)="typeFilter.set('ambos')">Venta e insumo</button>
</div>

@if (loading()) {
  <p class="products__message">Cargando productos y categorías...</p>
} @else {
  <app-data-table
    [columns]="columns"
    [rows]="filteredProducts()"
    [clickableRows]="true"
    emptyTitle="No hay productos en esta categoría."
    searchPlaceholder="Buscar producto..."
    (rowClick)="openEdit($event)"
  />
}

<app-modal
  [open]="formOpen()"
  [title]="editingId() ? 'Editar producto' : 'Nuevo producto'"
  size="lg"
  (closed)="close()"
>
  <form [formGroup]="form" class="products__form">
    <app-form-field label="Código (SKU)" required>
      <input formControlName="sku" maxlength="25" />
    </app-form-field>

    <app-form-field label="Nombre" required>
      <input formControlName="name" maxlength="150" />
    </app-form-field>

    <app-form-field label="Descripción">
      <textarea formControlName="description" rows="2"></textarea>
    </app-form-field>

    <div class="products__category">
      <app-form-field label="Categoría" required>
        <select formControlName="categoryId">
          <option [ngValue]="0" disabled>Selecciona una categoría</option>
          @for (category of categories(); track category.id) {
            <option [ngValue]="category.id">{{ category.name }}</option>
          }
        </select>
      </app-form-field>
      <button type="button" class="products__text-button" (click)="toggleCategoryForm()">
        {{ categoryFormOpen() ? 'Cancelar' : '+ Nueva categoría' }}
      </button>
    </div>

    @if (categoryFormOpen()) {
      <div class="products__new-category">
        <div [formGroup]="categoryForm">
          <app-form-field label="Nombre de la nueva categoría" required>
            <input formControlName="name" maxlength="100" />
          </app-form-field>
          <button type="button" class="products__text-button"
            [disabled]="creatingCategory()" (click)="createCategory()">
            {{ creatingCategory() ? 'Creando...' : 'Crear categoría' }}
          </button>
        </div>
      </div>
    }

    <app-form-field label="Tipo" required>
      <select formControlName="type">
        <option value="venta">Producto para venta</option>
        <option value="insumo">Insumo</option>
        <option value="ambos">Venta e insumo</option>
      </select>
    </app-form-field>

    <app-form-field label="Unidad" required>
      <input formControlName="unit" maxlength="20" />
    </app-form-field>

    @if (form.controls.type.value !== 'insumo') {
      <app-form-field label="Precio de venta">
        <input type="number" min="0" step="0.01" formControlName="salePrice" />
      </app-form-field>
    }

    <app-form-field label="Costo" required>
      <input type="number" min="0" step="0.01" formControlName="cost" />
    </app-form-field>

    <app-form-field label="Stock actual" required>
      <input type="number" min="0" step="0.01" formControlName="currentStock"
        [readonly]="!!editingId()" />
    </app-form-field>

    <app-form-field label="Stock mínimo" required>
      <input type="number" min="0" step="0.01" formControlName="minStock" />
    </app-form-field>

    @if (editingId()) {
      <label class="products__active">
        <input type="checkbox" formControlName="active" />
        Producto activo
      </label>
    }
  </form>

  <div modal-footer>
    <app-button variant="secondary" (clicked)="close()">Cancelar</app-button>
    <app-button (clicked)="save()">
      {{ saving() ? 'Guardando...' : 'Guardar' }}
    </app-button>
  </div>
</app-modal>
