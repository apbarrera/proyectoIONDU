# Solo para desarrollo local: publica el puerto 8080 para abrir http://localhost:8080
# Docker Compose carga este archivo automáticamente junto con docker-compose.yml.
# En Coolify NO se usa (Coolify solo lee docker-compose.yml).
#
# También agrega un PostgreSQL local ("db") para desarrollar sin depender de
# Supabase, y un almacenamiento S3 local ("storage") para los PDF de las facturas.
# Con COMPOSE_PROFILES=ia en .env se levanta además "stt" (Whisper) para los mensajes
# de voz del agente de IA.
# Las tres conexiones de .env son obligatorias; en local pueden apuntar
# a este PostgreSQL (ver la nota de DATABASE_URL en .env.example).

x-local-db-url: &local-db-url
  DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL con el usuario de API}
  WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?Define WORKER_DATABASE_URL con el usuario del worker}
  MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Define MIGRATION_DATABASE_URL con el usuario de migraciones}
  # Almacenamiento local (servicio "storage", SeaweedFS con API S3).
  STORAGE_ENDPOINT_URL: http://storage:8333
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Define STORAGE_ACCESS_KEY_ID en .env (ver .env.example)}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Define STORAGE_SECRET_ACCESS_KEY en .env (ver .env.example)}

services:
  web:
    ports:
      - "8080:80"

  api:
    environment:
      <<: *local-db-url
      # Usuario con el que actúa la API sin token (solo con APP_ENV=development).
      DEV_USER_ID: ${DEV_USER_ID:-}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  worker:
    environment:
      <<: *local-db-url
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  # Almacenamiento de archivos con API S3, como Supabase Storage. Solo red interna:
  # la API y el worker lo usan; no se publica ningún puerto.
  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    environment:
      # Credenciales de administrador del S3 local (las mismas que usa la API).
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Define STORAGE_ACCESS_KEY_ID en .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Define STORAGE_SECRET_ACCESS_KEY en .env}
    expose:
      - "8333"
    volumes:
      - storage-data:/data

  # Correo de desarrollo: recibe todo lo que envía la API (recuperación de contraseña e
  # invitaciones) sin mandarlo a internet. Bandeja en http://localhost:8025, solo en este
  # equipo. En .env: SMTP_HOST=mailpit, SMTP_PORT=1025 y SMTP_STARTTLS=false.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"

  # Servidor IMAP/SMTP de pruebas para la lectura de facturas por correo (RF-3.2).
  # Opcional: perfil "correo". Acepta cualquier usuario y clave; los buzones se crean al
  # recibir el primer correo. En Configuración → Empresa: servidor greenmail, puerto 3143,
  # seguridad "ninguna". Para enviarle una factura: SMTP greenmail:3025.
  greenmail:
    image: greenmail/standalone:2.1.2
    profiles: ["correo"]
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"
    expose:
      - "3025"
      - "3143"

  # Voz a texto para el agente de IA (Whisper, API de OpenAI /v1/audio/transcriptions).
  # Opcional: solo con el perfil "ia". Corre en CPU para no competir con Ollama por la GPU;
  # la primera vez descarga el modelo (~500 MB) y lo guarda en el volumen.
  stt:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["ia"]
    restart: unless-stopped
    # Arranca el servidor y, cuando responde, descarga el modelo si todavía no está en el
    # volumen (speaches no lo hace solo; si ya está, la descarga termina enseguida).
    command:
      - sh
      - -c
      - |
        uvicorn --factory speaches.main:create_app &
        until python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health')" 2>/dev/null; do sleep 1; done
        python -c "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/v1/models/$$STT_MODEL', method='POST'), timeout=1800)" && echo "Modelo de voz listo: $$STT_MODEL"
        wait
    environment:
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      ENABLE_UI: "false"
      LOG_LEVEL: info
    expose:
      - "8000"
    volumes:
      - stt-models:/home/ubuntu/.cache/huggingface/hub

  # Misma versión mayor de PostgreSQL que Supabase.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iondu
      POSTGRES_USER: iondu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
      TZ: America/Guayaquil
    # 15432 en el host para no chocar con PostgreSQL instalados en Windows (5432-5434).
    # Solo 127.0.0.1: accesible desde esta computadora, no desde la red.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iondu -d iondu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  storage-data:
  stt-models:
