name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --no-watch
      - run: npx ng build

  backend:
    name: Backend (revisión y pruebas en Docker)
    runs-on: ubuntu-latest
    # PostgreSQL temporal para las pruebas con base de datos (sin contraseña: solo vive en el CI).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iondu
          POSTGRES_DB: iondu_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iondu -d iondu_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # El target "test" ejecuta Ruff y pytest al construir (sin base, esas pruebas se saltan).
      - run: docker build --target test -t iondu-backend-test backend
      # Usuario restringido para demostrar las políticas RLS durante las pruebas.
      - name: Crear usuario de pruebas
        run: >-
          docker run --rm --network host
          postgres:17-alpine
          psql -h 127.0.0.1 -U iondu -d iondu_test
          -v ON_ERROR_STOP=1
          -c "CREATE ROLE iondu_test_runner LOGIN NOSUPERUSER NOBYPASSRLS;"
          -c "GRANT CONNECT, CREATE, TEMP ON DATABASE iondu_test TO iondu_test_runner;"
          -c "GRANT USAGE, CREATE ON SCHEMA public TO iondu_test_runner;"

      # Todas las pruebas usan el usuario restringido.
      - run: >-
          docker run --rm --network host
          -e TEST_DATABASE_URL=postgresql+psycopg://iondu_test_runner@127.0.0.1:5432/iondu_test
          iondu-backend-test python -m pytest -q
  imagenes:
    name: Imágenes Docker (build completo)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      # Solo el archivo de producción (el que lee Coolify); el override es para
      # desarrollo local y exige variables (.env) que el CI no tiene.
      - name: Build production images
        env:
          DATABASE_URL: postgresql+psycopg://iondu:ci_only@localhost:5432/iondu_test
          WORKER_DATABASE_URL: postgresql+psycopg://iondu_worker:ci_only@localhost:5432/iondu_test
          MIGRATION_DATABASE_URL: postgresql+psycopg://iondu_migrator:ci_only@localhost:5432/iondu_test
        run: docker compose -f docker-compose.yml build
