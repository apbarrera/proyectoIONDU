<main class="login">
  <div class="login__card">
    <div class="login__brand">
      <app-logo class="login__logo" [size]="48" />
      <h1 class="login__product">Recupera tu contraseña</h1>
      <p class="login__tagline">Te enviaremos un enlace para elegir una nueva.</p>
    </div>

    @if (sentMessage(); as message) {
      <p class="login__notice" role="status">{{ message }}</p>
      <a class="login__link" routerLink="/login">Volver a iniciar sesión</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
        <app-form-field label="Correo electrónico" required>
          <input type="email" formControlName="email" placeholder="tucorreo@empresa.com" autocomplete="email" />
        </app-form-field>

        @if (errorMessage()) {
          <p class="login__error" role="alert">{{ errorMessage() }}</p>
        }

        <app-button type="submit" [loading]="submitting()" fullWidth>Enviar enlace</app-button>
      </form>
      <a class="login__link" routerLink="/login">Volver a iniciar sesión</a>
    }
  </div>
</main>
