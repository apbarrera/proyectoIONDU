# ============================================================
# IONDU · Nginx para Angular PWA detrás de Traefik (Coolify)
# - Traefik termina TLS (HTTPS) y reenvía HTTP a este contenedor.
# - Nginx sirve la SPA y hace proxy de /api → contenedor "api"
#   (mismo origen = sin CORS, cookies más simples, PWA más estable).
# ============================================================

# Resolver DNS interno de Docker: permite arrancar Nginx aunque "api"
# todavía no exista y re-resolver la IP si el contenedor se recrea.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # IP real del cliente (viene de Traefik en la red interna de Docker)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Compresión (Traefik puede comprimir también; no hace daño aquí)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # Facturas/fotos enviadas al agente IA
    client_max_body_size 15m;

    # ---------- Healthcheck para Docker/Coolify ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---------- Proxy a la API ----------
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;          # conserva el prefijo /api
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        # Llamadas al SRI / IA pueden tardar
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        # Respuestas de la API nunca se cachean en el navegador por defecto
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # ---------- Archivos del Service Worker: NUNCA cachear ----------
    # Si se cachean, los usuarios se quedan "pegados" en versiones viejas.
    location ~* ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # ---------- Bundles con hash (main-ABCD1234.js, styles-XXXX.css) ----------
    location ~* "-[A-Za-z0-9]{8,}\.(js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- Otros estáticos sin hash (assets/, public/, íconos) ----------
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|json)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- SPA / HTML5 routing ----------
    # /ventas/123 no existe como archivo → se entrega index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
