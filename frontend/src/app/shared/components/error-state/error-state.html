<div class="error-state">
  <app-icon class="error-state__icon" name="warning" [size]="36" />
  <p class="error-state__title">{{ title() }}</p>
  @if (description()) {
    <p class="error-state__description">{{ description() }}</p>
  }
  <app-button variant="secondary" size="sm" (clicked)="retry.emit()">{{ retryLabel() }}</app-button>
</div>
