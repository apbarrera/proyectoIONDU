name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --no-watch
      - run: npx ng build

  backend:
    name: Backend (pruebas en Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El target "test" ejecuta pytest al construir: si una prueba falla, falla el build.
      - run: docker build --target test backend

  imagenes:
    name: Imágenes Docker (build completo)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
