# ============================================================
# IONDU · Configuración de Alembic (migraciones de la base de datos)
# Se ejecuta desde backend/:  alembic upgrade head
# La dirección de la base NO va aquí: env.py la lee de DATABASE_URL.
# ============================================================
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Nombre de archivo con fecha para que las migraciones se lean en orden:
# 2026_10_21_1530-<id>_crear_tabla_producto.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = America/Guayaquil
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
