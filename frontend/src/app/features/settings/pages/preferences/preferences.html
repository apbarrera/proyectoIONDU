<app-page-header
  title="Preferencias"
  subtitle="Personaliza cómo se ve IONDU para ti."
  [breadcrumb]="[{ label: 'Configuración', link: '/settings/company' }, { label: 'Preferencias' }]"
/>

<app-card title="Apariencia">
  <p class="preferences__description">Elige el modo de color de la interfaz.</p>
  <div class="preferences__options">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="preferences__option"
        [class.preferences__option--active]="themeService.preference() === option.value"
        (click)="themeService.setPreference(option.value)"
      >
        <app-icon class="preferences__icon" [name]="option.icon" [size]="20" />
        <span>{{ option.label }}</span>
      </button>
    }
  </div>
</app-card>
