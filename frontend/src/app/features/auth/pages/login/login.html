<main class="login">
  <div class="login__card">
    <div class="login__brand">
      <app-logo class="login__logo" [size]="56" />
      <h1 class="login__product">IONDU</h1>
      <p class="login__tagline">Agente de IA integrado en tu negocio.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
      <app-form-field label="Correo electrónico" required>
        <input
          type="email"
          formControlName="email"
          placeholder="tucorreo@empresa.com"
          autocomplete="email"
        />
      </app-form-field>

      <app-form-field label="Contraseña" required>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </app-form-field>

      @if (errorMessage()) {
        <p class="login__error" role="alert">{{ errorMessage() }}</p>
      }

      <app-button type="submit" [loading]="submitting()" fullWidth>
        Iniciar sesión
      </app-button>
    </form>
  </div>
</main>
