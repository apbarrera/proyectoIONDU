<div class="card" [class.card--padded]="padded()">
  @if (title()) {
    <div class="card__header">
      <h3 class="card__title">{{ title() }}</h3>
      <div class="card__actions">
        <ng-content select="[card-actions]" />
      </div>
    </div>
  }
  <div class="card__body">
    <ng-content />
  </div>
  <ng-content select="[card-footer]" />
</div>
